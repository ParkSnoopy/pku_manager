name: Native release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - id: release
        name: Read release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=''
          while IFS= read -r line; do
            case "$line" in
              'version: '*)
                VERSION="${line#version: }"
                VERSION="${VERSION%%+*}"
                break
                ;;
            esac
          done < pubspec.yaml
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'pubspec.yaml version must use X.Y.Z: %s\n' "$VERSION" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          TAG_SHA=''
          while read -r sha ref; do
            if [[ -z "$TAG_SHA" || "$ref" == "refs/tags/${TAG}^{}" ]]; then
              TAG_SHA="$sha"
            fi
          done < <(git ls-remote --tags origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}")
          if [[ -n "$TAG_SHA" && "$TAG_SHA" != "$GITHUB_SHA" ]]; then
            printf '%s already points to another commit; update pubspec.yaml before releasing.\n' "$TAG" >&2
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

  linux:
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Download Noto CJK fonts
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/noto-sans.zip" \
            https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/00_NotoSansCJK.ttc.zip
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/noto-serif.zip" \
            https://github.com/notofonts/noto-cjk/releases/download/Serif2.003/01_NotoSerifCJK.ttc.zip
          unzip -p "$RUNNER_TEMP/noto-sans.zip" NotoSansCJK.ttc > assets/fonts/NotoSansCJK.ttc
          unzip -p "$RUNNER_TEMP/noto-serif.zip" NotoSerifCJK.ttc > assets/fonts/NotoSerifCJK.ttc
          test -s assets/fonts/NotoSansCJK.ttc
          test -s assets/fonts/NotoSerifCJK.ttc
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update \
            -o Dir::Etc::sourcelist='sources.list.d/ubuntu.sources' \
            -o Dir::Etc::sourceparts='-'
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            libayatana-appindicator3-dev libfuse2t64 xvfb
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build linux --release
      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/tools
          curl --fail --location --output build/tools/appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          printf '%s  %s\n' ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0 build/tools/appimagetool | sha256sum --check
          chmod +x build/tools/appimagetool
          curl --fail --location --output build/tools/runtime-x86_64 https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          printf '%s  %s\n' 1cc49bcf1e2ccd593c379adb17c9f85a36d619088296504de95b1d06215aebbf build/tools/runtime-x86_64 | sha256sum --check
          cmake -S packaging/linux -B build/appimage -G Ninja -DAPPIMAGETOOL="$PWD/build/tools/appimagetool" -DRUNTIME="$PWD/build/tools/runtime-x86_64"
          cmake --build build/appimage --target appimage
          mv build/appimage/pku-manager.AppImage "build/appimage/PKU_Manager-v${VERSION}-linux.AppImage"
      - name: Launch packaged runtime
        shell: bash
        run: |
          set +e
          GDK_BACKEND=x11 xvfb-run -a timeout 15s "build/appimage/PKU_Manager-v${VERSION}-linux.AppImage" > build/appimage/runtime.log 2>&1
          status=$?
          test "$status" = 124
      - name: Launch Firejail AppImage entrypoint
        shell: bash
        run: |
          set -euo pipefail
          APPDIR="$PWD/build/appimage/PKUManager.AppDir"
          readelf -d "$APPDIR/pku_manager" | grep -F 'Library runpath: [$ORIGIN/lib]'
          readelf -d "$APPDIR/lib/libtray_manager_plugin.so" | grep -F 'Library rpath: [$ORIGIN]'
          for library in \
            libayatana-appindicator3.so.1 \
            libayatana-indicator3.so.7 \
            libayatana-ido3-0.4.so.0 \
            libdbusmenu-glib.so.4 \
            libdbusmenu-gtk3.so.4; do
            test -f "$APPDIR/lib/$library"
          done
          set +e
          GDK_BACKEND=x11 LD_DEBUG=libs xvfb-run -a timeout 15s \
            "$APPDIR/pku_manager" > build/appimage/firejail-entrypoint.log 2>&1
          status=$?
          set -e
          test "$status" = 124
          for library in \
            libayatana-appindicator3.so.1 \
            libayatana-indicator3.so.7 \
            libayatana-ido3-0.4.so.0 \
            libdbusmenu-glib.so.4 \
            libdbusmenu-gtk3.so.4; do
            grep -F "calling init: $APPDIR/lib/$library" \
              build/appimage/firejail-entrypoint.log
          done
      - uses: actions/upload-artifact@v4
        with:
          name: PKU_Manager-v${{ needs.prepare.outputs.version }}-linux.AppImage
          path: build/appimage/PKU_Manager-v${{ needs.prepare.outputs.version }}-linux.AppImage
          if-no-files-found: error

  android:
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Download Noto CJK fonts
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/noto-sans.zip" \
            https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/00_NotoSansCJK.ttc.zip
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/noto-serif.zip" \
            https://github.com/notofonts/noto-cjk/releases/download/Serif2.003/01_NotoSerifCJK.ttc.zip
          unzip -p "$RUNNER_TEMP/noto-sans.zip" NotoSansCJK.ttc > assets/fonts/NotoSansCJK.ttc
          unzip -p "$RUNNER_TEMP/noto-serif.zip" NotoSerifCJK.ttc > assets/fonts/NotoSerifCJK.ttc
          test -s assets/fonts/NotoSansCJK.ttc
          test -s assets/fonts/NotoSerifCJK.ttc
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: flutter build apk --release
      - name: Name Android artifact
        shell: bash
        run: mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/PKU_Manager-v${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: PKU_Manager-v${{ needs.prepare.outputs.version }}-android.apk
          path: build/app/outputs/flutter-apk/PKU_Manager-v${{ needs.prepare.outputs.version }}-android.apk
          if-no-files-found: error

  apple:
    needs: prepare
    runs-on: macos-15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Download Noto CJK fonts
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/noto-sans.zip" \
            https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/00_NotoSansCJK.ttc.zip
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/noto-serif.zip" \
            https://github.com/notofonts/noto-cjk/releases/download/Serif2.003/01_NotoSerifCJK.ttc.zip
          unzip -p "$RUNNER_TEMP/noto-sans.zip" NotoSansCJK.ttc > assets/fonts/NotoSansCJK.ttc
          unzip -p "$RUNNER_TEMP/noto-serif.zip" NotoSerifCJK.ttc > assets/fonts/NotoSerifCJK.ttc
          test -s assets/fonts/NotoSansCJK.ttc
          test -s assets/fonts/NotoSerifCJK.ttc
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: flutter build macos --release
      - run: flutter test
      - run: flutter build ios --release --no-codesign
      - run: flutter build ios --simulator
      - name: Archive Apple bundles
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --keepParent build/macos/Build/Products/Release/pku_manager.app "build/PKU_Manager-v${VERSION}-macos.zip"
          ditto -c -k --keepParent build/ios/iphoneos/Runner.app "build/PKU_Manager-v${VERSION}-ios.zip"
          ditto -c -k --keepParent build/ios/iphonesimulator/Runner.app "build/PKU_Manager-v${VERSION}-ios-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: PKU_Manager-v${{ needs.prepare.outputs.version }}-macos.zip
          path: build/PKU_Manager-v${{ needs.prepare.outputs.version }}-macos.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PKU_Manager-v${{ needs.prepare.outputs.version }}-ios.zip
          path: build/PKU_Manager-v${{ needs.prepare.outputs.version }}-ios.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PKU_Manager-v${{ needs.prepare.outputs.version }}-ios-simulator.zip
          path: build/PKU_Manager-v${{ needs.prepare.outputs.version }}-ios-simulator.zip
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Download Noto CJK fonts
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/noto-sans.zip" \
            https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/00_NotoSansCJK.ttc.zip
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/noto-serif.zip" \
            https://github.com/notofonts/noto-cjk/releases/download/Serif2.003/01_NotoSerifCJK.ttc.zip
          unzip -p "$RUNNER_TEMP/noto-sans.zip" NotoSansCJK.ttc > assets/fonts/NotoSansCJK.ttc
          unzip -p "$RUNNER_TEMP/noto-serif.zip" NotoSerifCJK.ttc > assets/fonts/NotoSerifCJK.ttc
          test -s assets/fonts/NotoSansCJK.ttc
          test -s assets/fonts/NotoSerifCJK.ttc
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: flutter build windows --release
      - run: flutter test
      - run: choco install nsis --version=3.11 -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\NSIS\makensis.exe' packaging/windows/installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item packaging/windows/pku-manager-setup.exe "packaging/windows/PKU_Manager-v${env:VERSION}-windows.exe"
      - name: Install, upgrade, launch, uninstall
        shell: pwsh
        run: |
          $installer = Resolve-Path "packaging/windows/PKU_Manager-v${env:VERSION}-windows.exe"
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\PKU Manager'
          $install = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Installation failed' }
          $upgrade = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw 'Upgrade failed' }
          $app = Start-Process "$installed\pku_manager.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw 'Installed runtime exited early' }
          Stop-Process -Id $app.Id
          Start-Process "$installed\Uninstall.exe" -ArgumentList '/S' -Wait
      - uses: actions/upload-artifact@v4
        with:
          name: PKU_Manager-v${{ needs.prepare.outputs.version }}-windows.exe
          path: packaging/windows/PKU_Manager-v${{ needs.prepare.outputs.version }}-windows.exe
          if-no-files-found: error

  release:
    needs: [prepare, linux, android, apple, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: PKU_Manager-v${{ needs.prepare.outputs.version }}-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes
          fi
