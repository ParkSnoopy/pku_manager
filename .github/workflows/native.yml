name: Native release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      build_number: ${{ steps.release.outputs.build_number }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          token: ${{ env.GITHUB_TOKEN }}
      - id: release
        name: Read release version
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GITHUB_TOKEN"
          gh api "repos/$GITHUB_REPOSITORY" >/dev/null
          VERSION="$(grep -m1 '^version: ' pubspec.yaml)"
          VERSION="${VERSION#version: }"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          (( MINOR < 1000 && PATCH < 1000 ))
          BUILD_NUMBER=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          (( BUILD_NUMBER >= 1 && BUILD_NUMBER <= 2100000000 ))
          TAG="v${VERSION}"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'build_number=%s\n' "$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

  linux:
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          token: ${{ env.GITHUB_TOKEN }}
      - name: Download Noto CJK fonts
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/noto-sans.zip" \
            https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/00_NotoSansCJK.ttc.zip
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/noto-serif.zip" \
            https://github.com/notofonts/noto-cjk/releases/download/Serif2.003/01_NotoSerifCJK.ttc.zip
          unzip -p "$RUNNER_TEMP/noto-sans.zip" NotoSansCJK.ttc > assets/fonts/NotoSansCJK.ttc
          unzip -p "$RUNNER_TEMP/noto-serif.zip" NotoSerifCJK.ttc > assets/fonts/NotoSerifCJK.ttc
          test -s assets/fonts/NotoSansCJK.ttc
          test -s assets/fonts/NotoSerifCJK.ttc
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update \
            -o Dir::Etc::sourcelist='sources.list.d/ubuntu.sources' \
            -o Dir::Etc::sourceparts='-'
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            libayatana-appindicator3-dev libfuse2t64 xvfb
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build linux --release
      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/tools
          curl --fail --location --output build/tools/appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          printf '%s  %s\n' ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0 build/tools/appimagetool | sha256sum --check
          chmod +x build/tools/appimagetool
          curl --fail --location --output build/tools/runtime-x86_64 https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          printf '%s  %s\n' 1cc49bcf1e2ccd593c379adb17c9f85a36d619088296504de95b1d06215aebbf build/tools/runtime-x86_64 | sha256sum --check
          cmake -S packaging/linux -B build/appimage -G Ninja -DAPPIMAGETOOL="$PWD/build/tools/appimagetool" -DRUNTIME="$PWD/build/tools/runtime-x86_64"
          cmake --build build/appimage --target appimage
          mv build/appimage/pku-manager.AppImage "build/appimage/PKU_Manager-v${VERSION}-linux.AppImage"
      - name: Launch packaged runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(GDK_BACKEND=x11 APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a timeout 15s \
            "build/appimage/PKU_Manager-v${VERSION}-linux.AppImage" \
            > build/appimage/runtime.log 2>&1; printf '%s' "$?")" = 124
      - name: Launch Firejail AppImage entrypoint
        shell: bash
        run: |
          set -euo pipefail
          APPDIR="$PWD/build/appimage/PKUManager.AppDir"
          readelf -d "$APPDIR/pku_manager" | grep -F 'Library runpath: [$ORIGIN/lib]'
          readelf -d "$APPDIR/lib/libtray_manager_plugin.so" | grep -F 'Library rpath: [$ORIGIN]'
          test -f "$APPDIR/lib/libayatana-appindicator3.so.1"
          test -f "$APPDIR/lib/libayatana-indicator3.so.7"
          test -f "$APPDIR/lib/libayatana-ido3-0.4.so.0"
          test -f "$APPDIR/lib/libdbusmenu-glib.so.4"
          test -f "$APPDIR/lib/libdbusmenu-gtk3.so.4"
          test "$(GDK_BACKEND=x11 LD_DEBUG=libs xvfb-run -a timeout 15s \
            "$APPDIR/pku_manager" \
            > build/appimage/firejail-entrypoint.log 2>&1; printf '%s' "$?")" = 124
          grep -F "calling init: $APPDIR/lib/libayatana-appindicator3.so.1" build/appimage/firejail-entrypoint.log
          grep -F "calling init: $APPDIR/lib/libayatana-indicator3.so.7" build/appimage/firejail-entrypoint.log
          grep -F "calling init: $APPDIR/lib/libayatana-ido3-0.4.so.0" build/appimage/firejail-entrypoint.log
          grep -F "calling init: $APPDIR/lib/libdbusmenu-glib.so.4" build/appimage/firejail-entrypoint.log
          grep -F "calling init: $APPDIR/lib/libdbusmenu-gtk3.so.4" build/appimage/firejail-entrypoint.log
      - uses: actions/upload-artifact@v4
        with:
          name: PKU_Manager-v${{ needs.prepare.outputs.version }}-linux.AppImage
          path: build/appimage/PKU_Manager-v${{ needs.prepare.outputs.version }}-linux.AppImage
          if-no-files-found: error

  android:
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          token: ${{ env.GITHUB_TOKEN }}
      - name: Restore Android release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/pku-manager-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null
          printf 'ANDROID_KEYSTORE_PATH=%s\n' "$KEYSTORE" >> "$GITHUB_ENV"
      - name: Download Noto CJK fonts
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/noto-sans.zip" \
            https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/00_NotoSansCJK.ttc.zip
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/noto-serif.zip" \
            https://github.com/notofonts/noto-cjk/releases/download/Serif2.003/01_NotoSerifCJK.ttc.zip
          unzip -p "$RUNNER_TEMP/noto-sans.zip" NotoSansCJK.ttc > assets/fonts/NotoSansCJK.ttc
          unzip -p "$RUNNER_TEMP/noto-serif.zip" NotoSerifCJK.ttc > assets/fonts/NotoSerifCJK.ttc
          test -s assets/fonts/NotoSansCJK.ttc
          test -s assets/fonts/NotoSerifCJK.ttc
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - name: Build signed Android APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          flutter build apk --release
          --build-name "$VERSION"
          --build-number "$BUILD_NUMBER"
      - name: Verify Android identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT2="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt2 -print | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$AAPT2"
          test -x "$APKSIGNER"
          BADGING="$("$AAPT2" dump badging "$APK")"
          grep -F "package: name='com.parksnoopy.pku_manager' versionCode='$BUILD_NUMBER' versionName='$VERSION'" <<< "$BADGING"
          "$APKSIGNER" verify --verbose "$APK"
      - name: Name Android artifact
        shell: bash
        run: mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/PKU_Manager-v${VERSION}-android.apk"
      - name: Remove Android release key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/pku-manager-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: PKU_Manager-v${{ needs.prepare.outputs.version }}-android.apk
          path: build/app/outputs/flutter-apk/PKU_Manager-v${{ needs.prepare.outputs.version }}-android.apk
          if-no-files-found: error

  apple:
    needs: prepare
    runs-on: macos-15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          token: ${{ env.GITHUB_TOKEN }}
      - name: Download Noto CJK fonts
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/noto-sans.zip" \
            https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/00_NotoSansCJK.ttc.zip
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/noto-serif.zip" \
            https://github.com/notofonts/noto-cjk/releases/download/Serif2.003/01_NotoSerifCJK.ttc.zip
          unzip -p "$RUNNER_TEMP/noto-sans.zip" NotoSansCJK.ttc > assets/fonts/NotoSansCJK.ttc
          unzip -p "$RUNNER_TEMP/noto-serif.zip" NotoSerifCJK.ttc > assets/fonts/NotoSerifCJK.ttc
          test -s assets/fonts/NotoSansCJK.ttc
          test -s assets/fonts/NotoSerifCJK.ttc
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: flutter build macos --release
      - run: flutter test
      - run: flutter build ios --release --no-codesign
      - run: flutter build ios --simulator
      - name: Archive Apple bundles
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --keepParent build/macos/Build/Products/Release/pku_manager.app "build/PKU_Manager-v${VERSION}-macos.zip"
          ditto -c -k --keepParent build/ios/iphoneos/Runner.app "build/PKU_Manager-v${VERSION}-ios.zip"
          ditto -c -k --keepParent build/ios/iphonesimulator/Runner.app "build/PKU_Manager-v${VERSION}-ios-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: PKU_Manager-v${{ needs.prepare.outputs.version }}-macos.zip
          path: build/PKU_Manager-v${{ needs.prepare.outputs.version }}-macos.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PKU_Manager-v${{ needs.prepare.outputs.version }}-ios.zip
          path: build/PKU_Manager-v${{ needs.prepare.outputs.version }}-ios.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PKU_Manager-v${{ needs.prepare.outputs.version }}-ios-simulator.zip
          path: build/PKU_Manager-v${{ needs.prepare.outputs.version }}-ios-simulator.zip
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          token: ${{ env.GITHUB_TOKEN }}
      - name: Verify Windows package inputs
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            throw 'Windows package certificate is unavailable.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'Windows package certificate password is unavailable.'
          }
      - name: Download Noto CJK fonts
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/noto-sans.zip" \
            https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/00_NotoSansCJK.ttc.zip
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/noto-serif.zip" \
            https://github.com/notofonts/noto-cjk/releases/download/Serif2.003/01_NotoSerifCJK.ttc.zip
          unzip -p "$RUNNER_TEMP/noto-sans.zip" NotoSansCJK.ttc > assets/fonts/NotoSansCJK.ttc
          unzip -p "$RUNNER_TEMP/noto-serif.zip" NotoSerifCJK.ttc > assets/fonts/NotoSerifCJK.ttc
          test -s assets/fonts/NotoSansCJK.ttc
          test -s assets/fonts/NotoSerifCJK.ttc
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - run: flutter test
      - name: Restore Windows package certificate
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $certificate = Join-Path $env:RUNNER_TEMP 'pku-manager-release.pfx'
          [IO.File]::WriteAllBytes(
            $certificate,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
          if ((Get-Item $certificate).Length -eq 0) {
            throw 'Windows package certificate is empty.'
          }
          "WINDOWS_CERTIFICATE_PATH=$certificate" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build signed MSIX
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force build/msix | Out-Null
          dart run msix:create `
            --certificate-path $env:WINDOWS_CERTIFICATE_PATH `
            --certificate-password $env:WINDOWS_CERTIFICATE_PASSWORD `
            --output-name "PKU_Manager-v${env:VERSION}-windows"
      - name: Install, launch, and uninstall MSIX
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Appx -ErrorAction Stop
          $package = Resolve-Path "build/msix/PKU_Manager-v${env:VERSION}-windows.msix"
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $env:WINDOWS_CERTIFICATE_PATH,
            $env:WINDOWS_CERTIFICATE_PASSWORD,
            [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          )
          $publicCertificate = Join-Path $env:RUNNER_TEMP 'pku-manager-release.cer'
          [IO.File]::WriteAllBytes(
            $publicCertificate,
            $certificate.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert)
          )
          $trustedCertificate = $null
          $installed = $null
          $app = $null
          try {
            $trustedCertificate = Import-Certificate `
              -FilePath $publicCertificate `
              -CertStoreLocation Cert:\LocalMachine\TrustedPeople
            $signTools = Get-ChildItem `
              -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" `
              -File
            $signTool = $signTools | Sort-Object {
              [Version]$_.Directory.Parent.Name
            } -Descending | Select-Object -First 1
            if ($null -eq $signTool) {
              throw 'Windows SDK SignTool was not found.'
            }
            & $signTool.FullName verify /pa /v $package
            if ($LASTEXITCODE -ne 0) {
              throw "MSIX signature verification failed with exit code $LASTEXITCODE."
            }
            Add-AppxPackage -Path $package
            $installed = Get-AppxPackage -Name 'ParkSnoopy.PKUManager'
            if ($null -eq $installed) {
              throw 'Installed MSIX package was not registered.'
            }
            if ($installed.Version -ne [Version]"${env:VERSION}.0") {
              throw "Installed version '$($installed.Version)' does not match '${env:VERSION}.0'."
            }
            $manifest = Get-AppxPackageManifest -Package $installed.PackageFullName
            $applications = @($manifest.Package.Applications.Application)
            if ($applications.Count -ne 1) {
              throw 'Expected exactly one application in the installed MSIX manifest.'
            }
            $application = $applications[0]
            $executable = (Resolve-Path (Join-Path $installed.InstallLocation $application.Executable)).Path
            $aumid = "$($installed.PackageFamilyName)!$($application.Id)"
            Start-Process -FilePath "$env:WINDIR\explorer.exe" -ArgumentList "shell:AppsFolder\$aumid"
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            do {
              Start-Sleep -Seconds 1
              $app = Get-Process -Name ([IO.Path]::GetFileNameWithoutExtension($executable)) -ErrorAction SilentlyContinue |
                Where-Object { $_.Path -eq $executable } | Select-Object -First 1
            } until ($null -ne $app -or [DateTime]::UtcNow -ge $deadline)
            if ($null -eq $app) {
              throw "Registered application '$aumid' did not start within 30 seconds."
            }
            Start-Sleep -Seconds 10
            $app.Refresh()
            if ($app.HasExited) {
              throw "Installed application exited during the smoke test with code $($app.ExitCode)."
            }
          } finally {
            try {
              if ($null -ne $app -and !$app.HasExited) {
                Stop-Process -InputObject $app -Force
                $app.WaitForExit()
              }
              if ($null -ne $installed) {
                Remove-AppxPackage -Package $installed.PackageFullName
              }
            } finally {
              if ($null -ne $trustedCertificate) {
                Remove-Item "Cert:\LocalMachine\TrustedPeople\$($trustedCertificate.Thumbprint)" -Force
              }
              $certificate.Dispose()
              Remove-Item $publicCertificate -Force -ErrorAction SilentlyContinue
            }
          }
          if ($null -ne (Get-AppxPackage -Name 'ParkSnoopy.PKUManager')) {
            throw 'MSIX package remained registered after removal.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: PKU_Manager-v${{ needs.prepare.outputs.version }}-windows.msix
          path: build/msix/PKU_Manager-v${{ needs.prepare.outputs.version }}-windows.msix
          if-no-files-found: error
      - name: Remove Windows package certificate
        if: always()
        shell: pwsh
        run: |
          if (![string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PATH)) {
            Remove-Item $env:WINDOWS_CERTIFICATE_PATH -Force -ErrorAction SilentlyContinue
          }

  release:
    needs: [prepare, linux, android, apple, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - id: release_lookup
        name: Test existing release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ env.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
      - uses: actions/download-artifact@v4
        with:
          pattern: PKU_Manager-v${{ needs.prepare.outputs.version }}-*
          path: dist
          merge-multiple: true
          github-token: ${{ env.GITHUB_TOKEN }}
      - name: Override existing release assets
        if: steps.release_lookup.outcome == 'success'
        env:
          GH_TOKEN: ${{ env.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish new GitHub release
        if: steps.release_lookup.outcome == 'failure'
        env:
          GH_TOKEN: ${{ env.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
